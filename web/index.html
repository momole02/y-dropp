<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Y Dropp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237c3aed' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v12'/%3E%3Cpath d='m7 10 5 5 5-5'/%3E%3Cpath d='M5 21h14'/%3E%3C/svg%3E">
  <style>/*__CSS__*/</style>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex w-full max-w-xl flex-col gap-5 px-4 pb-16 pt-8 sm:pt-14">

    <header class="flex items-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-400 via-violet-500 to-pink-500 text-white shadow-lg shadow-violet-500/30">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      </div>
      <div class="min-w-0">
        <h1 class="text-xl font-semibold tracking-tight">Y Dropp</h1>
        <p class="truncate text-sm text-muted-foreground">Envoyer vers <span id="hostname" class="font-medium text-foreground"></span></p>
      </div>
      <span class="ml-auto inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-xs text-muted-foreground">
        <span id="status-dot" class="h-2 w-2 rounded-full bg-success"></span><span id="status-text">Connecté</span>
      </span>
    </header>

    <section id="pin-card" class="card hidden p-5">
      <label for="pin-input" class="mb-1 block text-sm font-medium">Code PIN</label>
      <p class="mb-3 text-sm text-muted-foreground">Saisissez le code à 6 chiffres affiché dans le terminal de l'ordinateur.</p>
      <input id="pin-input" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    </section>

    <label id="dropzone" for="file-input"
      class="card group flex cursor-pointer flex-col items-center justify-center gap-3 border-2 border-dashed px-6 py-12 text-center transition-colors hover:border-primary/60">
      <div class="flex h-14 w-14 items-center justify-center rounded-full bg-primary/10 text-primary transition-transform group-hover:scale-110">
        <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
      </div>
      <div>
        <p class="text-base font-medium">Touchez pour choisir des fichiers</p>
        <p class="text-sm text-muted-foreground">ou glissez-déposez-les ici · photos, vidéos, documents…</p>
        <p id="max-size" class="mt-1 hidden text-xs text-muted-foreground"></p>
      </div>
      <input id="file-input" type="file" multiple class="sr-only">
    </label>

    <section id="summary" class="card hidden p-5">
      <div class="mb-3 flex items-baseline justify-between gap-3">
        <p class="text-sm font-medium"><span id="summary-title">Envoi en cours…</span></p>
        <p id="summary-percent" class="font-mono text-sm tabular-nums text-muted-foreground">0 %</p>
      </div>
      <div class="progress h-2.5"><div id="summary-bar" class="progress-bar" style="width:0%"></div></div>
      <div class="mt-3 flex flex-wrap justify-between gap-x-4 gap-y-1 text-xs text-muted-foreground">
        <span id="summary-count">0 / 0 fichier</span>
        <span id="summary-bytes">0 o / 0 o</span>
        <span id="summary-speed">—</span>
      </div>
    </section>

    <section id="list-card" class="card hidden overflow-hidden">
      <div class="flex items-center justify-between border-b px-5 py-3">
        <h2 class="text-sm font-medium">Fichiers</h2>
        <button id="clear-done" type="button" class="btn-ghost h-8 px-3 text-xs">Effacer les terminés</button>
      </div>
      <ul id="file-list" class="divide-y"></ul>
    </section>

    <footer class="text-center text-xs text-muted-foreground">
      Les fichiers sont envoyés directement sur votre réseau local.
    </footer>
  </main>

  <template id="file-item">
    <li class="flex items-center gap-3 px-5 py-3.5">
      <div data-icon class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-muted text-muted-foreground"></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline justify-between gap-2">
          <p data-name class="truncate text-sm font-medium"></p>
          <p data-percent class="shrink-0 font-mono text-xs tabular-nums text-muted-foreground"></p>
        </div>
        <div class="progress my-1.5 h-1.5"><div data-bar class="progress-bar" style="width:0%"></div></div>
        <p data-status class="truncate text-xs text-muted-foreground"></p>
      </div>
      <button data-action type="button" class="btn-icon" aria-label="Annuler"></button>
    </li>
  </template>

  <script>window.YDROPP = __YDROPP_CONFIG__;</script>
  <script>/*__JS__*/</script>
</body>
</html>
